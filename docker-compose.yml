# Local development: Postgres + the FastAPI backend.
#   cp backend/.env.example backend/.env   (then fill in APP_PASSWORD_HASH and JWT_SECRET)
#   docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: flashcards
      POSTGRES_PASSWORD: flashcards
      POSTGRES_DB: flashcards
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flashcards -d flashcards"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    env_file:
      - path: ./backend/.env
        required: true
    environment:
      DATABASE_URL: postgresql+psycopg://flashcards:flashcards@db:5432/flashcards
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
