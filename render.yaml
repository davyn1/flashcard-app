# Render Blueprint for the backend (Dashboard -> New -> Blueprint).
# Use an external Postgres (Neon/Supabase free tier) and paste its URL as DATABASE_URL.
services:
  - type: web
    name: korean-flashcards-api
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: APP_PASSWORD_HASH
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
